<!-- 英语模块 · 学科页片段 -->
<!-- 由 main.js 通过 fetch 加载并注入 #contentContainer（内容会被 localStorage 缓存） -->
<!-- 逻辑在同目录的 english.js，样式在同目录的 english.css，调度引擎在同目录的 engine/ -->
<link rel="stylesheet" href="modules/english/english.css">

<!-- 复习界面：极简全屏风格，大量留白，不做事卡片包裹 -->
<!-- 关键设计：进入卡片只显示单词与音标；点「显示答案」后才揭晓例句（目标词高亮）与释义， -->
<!-- 并放出评分按钮，保证评分基于真实回忆结果，避免「看着答案打分」污染 FSRS 记忆状态。 -->
<div class="study" id="reviewApp">

    <!-- 顶栏：沉浸模式开关 / 今日统计 / 当前卡片的记忆元信息 -->
    <header class="study-top">
        <button class="study-nav-toggle" id="studyNavToggle" type="button">沉浸模式</button>
        <div class="study-counts">
            <div class="study-count"><b id="statTodayNew">0</b><span>今日新学</span></div>
            <div class="study-count"><b id="statTodayReview">0</b><span>今日复习</span></div>
            <div class="study-count"><b id="statRest">0</b><span>剩余待学</span></div>
        </div>
        <div class="study-meta" id="studyMeta"></div>
    </header>

    <!-- 主体：单词 + 音标（揭晓后在此追加例句与释义） -->
    <main class="study-stage" id="studyStage">
        <div class="study-word" id="reviewWord"></div>

        <div class="study-phonetic" id="reviewPhoneticRow">
            <span class="study-ipa" id="reviewPhonetic"></span>
            <button class="study-sound" id="reviewSpeakWordBtn" type="button"
                    title="朗读单词（P）" aria-label="朗读单词">🔊</button>
        </div>

        <div class="study-answer" id="reviewAnswer" style="display:none;">
            <!-- 主例句：由引擎切成片段，目标词高亮；下面一行是它的中文翻译 -->
            <blockquote class="study-quote" id="reviewExample"></blockquote>
            <p class="study-quote-cn" id="reviewExampleCn" style="display:none;"></p>
            <!-- 释义：一个词性一块（引擎按词性标签拆分），每块可带自己的例句与译文 -->
            <div class="study-senses" id="reviewSenses"></div>
        </div>

        <!-- 无卡片时（加载中 / 已完成 / 出错）的提示，避免销毁上面的结构 -->
        <div class="study-message" id="studyMessage" style="display:none;"></div>
    </main>

    <!-- 底部：揭晓前是「点击显示答案」，揭晓后是四个评分按钮 -->
    <footer class="study-foot">
        <div class="study-reveal" id="reviewReveal" style="display:none;">
            <button class="study-reveal-btn" id="reviewRevealBtn" type="button">
                点击显示答案 <span>(Space)</span>
            </button>
        </div>

        <div class="study-ratings" id="reviewButtons" style="display:none;">
            <button class="rating rating-again" data-rating="1" type="button">陌生 <span>(Q)</span></button>
            <button class="rating rating-hard" data-rating="2" type="button">困难 <span>(W)</span></button>
            <button class="rating rating-good" data-rating="3" type="button">一般 <span>(E)</span></button>
            <button class="rating rating-easy" data-rating="4" type="button">简单 <span>(R)</span></button>
        </div>

        <div class="study-footbar">
            <span class="study-status" id="reviewStatus">正在加载复习内容...</span>
            <button class="study-sound study-sound-text" id="reviewSpeakExampleBtn" type="button"
                    title="朗读例句（L）">🔊 例句</button>
            <label class="study-autospeak" title="出现新卡片时自动朗读单词">
                <input type="checkbox" id="reviewAutoSpeak"> 自动朗读
            </label>
        </div>

        <!-- 左下角小字：今日计划进度。刻意做得很淡、很小——
             它只是「心里有数」用的，不该抢卡片的注意力。
             计划走完之后会带动效切换成「计划完成 · 进入复习阶段」（见 english.js 的 setPlanText） -->
        <div class="study-plan" id="studyPlan">
            <span class="study-plan-text" id="studyPlanText"></span>
        </div>
    </footer>
</div>
