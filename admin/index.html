<!DOCTYPE html>
<!--
  广学 · 后台管理入口

  这是一个**独立页面**，与学生站（index.html）互不影响：
  不走 main.js 的导航，也不使用学科页的 localStorage 缓存。

  登录门禁：账号系统由独立的 Rust 认证服务提供（/api/auth/*，见 backend-rust/README.md）。
  打开本页时 admin.js 会先问 GET /api/auth/me：已登录且 role=admin 才渲染后台，
  否则只显示 #adminAuthGate 里的登录表单。

  ⚠️ 这只是界面层的门禁：Go 侧的 /api/words 等接口**目前还没有服务端鉴权**，
     直接调接口就能改数据（下一期补中间件）。在此之前仍不要部署到公网。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广学 · 后台管理</title>
    <!-- 首帧底色：外链样式表要等网络，这一句能让浏览器一开始就画出页面底色，
         而不是先闪一帧白屏（后台底色是 #f5f6f8，与 admin.css 的 body 一致） -->
    <style>html { background-color: #f5f6f8; }</style>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- ===================== 登录门禁 ===================== -->
    <!-- 默认可见：校验通过前不渲染后台内容，避免"先看到界面再被踢出去" -->
    <div class="admin-gate" id="adminAuthGate">
        <form class="admin-gate-box" id="adminLoginForm" novalidate>
            <h2>广学 · 后台登录</h2>
            <p class="admin-gate-tip">
                请使用管理员账号登录。账号由 Rust 认证服务提供
                （<code>/api/auth/*</code>）。
            </p>
            <div class="admin-field">
                <label for="gateEmail">邮箱</label>
                <input type="email" id="gateEmail" autocomplete="username" required>
            </div>
            <div class="admin-field">
                <label for="gatePassword">密码</label>
                <input type="password" id="gatePassword" autocomplete="current-password" required>
            </div>
            <p class="admin-gate-msg" id="gateMsg" role="status"></p>
            <button class="admin-btn admin-btn-primary admin-gate-submit" type="submit" id="gateSubmit">登录</button>
            <p class="admin-gate-foot">
                还没有账号？<a href="../account/">去账号中心注册</a>（需要管理员派发的邀请码）
            </p>
        </form>
    </div>

    <!-- ===================== 后台主布局 ===================== -->
    <!-- 默认隐藏，由 admin.js 校验登录态通过后显示 -->
    <div class="admin-layout" id="adminLayout" style="display:none;">
        <!-- 左侧栏：品牌 + 学科导航（由 admin.js 依据注册表渲染） -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <span class="admin-brand-name">广学</span>
                <span class="admin-brand-sub">后台管理</span>
            </div>
            <nav class="admin-nav" id="adminNav"></nav>
            <div class="admin-sidebar-footer">
                <a class="admin-link" href="../index.html">← 返回站点</a>
            </div>
        </aside>

        <!-- 右侧主区：标题栏 + 内容区（内容由学科后台模块渲染） -->
        <main class="admin-main">
            <header class="admin-topbar">
                <h1 class="admin-page-title" id="adminPageTitle">后台管理</h1>
                <div class="admin-topbar-right">
                    <!-- 后端连通性指示：调用 /api/health -->
                    <span class="admin-backend-status" id="backendStatus">检测后端…</span>
                    <!-- 当前登录账号（由 admin.js 填充） -->
                    <span class="admin-user" id="adminUser">未登录</span>
                    <button class="admin-btn admin-btn-sm" type="button" id="adminLogout" style="display:none;">退出登录</button>
                </div>
            </header>

            <!-- 安全提示（P1 更新）：本页现在只做**内容管理**。
                 阶段 2 已经给 Go 侧补上了服务端鉴权（RequireAdmin + CSRF 闸门），
                 旧文案还写着「Go 侧没有服务端鉴权」—— 留着它比没有提示更糟：会让人误判风险。
                 管理面板（看板 / 邀请码 / 用户 / 审计）搬去了个人中心，按角色显示。 -->
            <div class="admin-banner" id="securityBanner">
                🔐 本页只做<strong>内容管理</strong>（词条的增删改查与批量导入）：写接口要
                <code>role=admin</code> 并通过 CSRF 闸门。看板 / 邀请码 / 用户管理 / 审计日志
                已经搬到<a href="../account/#/dashboard">个人中心</a>，按账号角色显示。
            </div>

            <section class="admin-content" id="adminContent"></section>
        </main>
    </div>

    <!-- 提示条容器（由 admin.js 的 toast() 填充） -->
    <div class="admin-toasts" id="adminToasts"></div>

    <!-- 后台框架脚本（ES module，按需动态加载学科后台） -->
    <script type="module" src="admin.js"></script>
</body>
</html>
