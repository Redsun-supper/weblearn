<!DOCTYPE html>
<!-- lang="zh-CN" 供搜索引擎与屏幕阅读器判断页面语言 -->
<html lang="zh-CN">
<!-- 页面元信息：UTF-8 编码（防中文乱码）、移动端视口、标签页标题、站内样式表 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
    <!-- 从个人中心返回时（?from=account）先把主界面内容藏住：反向过场的第一帧必须已经
         是「整屏被遮罩盖住」的样子，否则会先闪一下主界面再开始倒放。
         这段必须内联在 head 里 —— 外链的 main.js 在 body 末尾，来不及。
         样式见 main.css 的 html.is-returning；main.js 摆好遮罩后会立刻摘掉这个类。 -->
    <script>
        if (/[?&]from=account(&|=|$)/.test(location.search)) {
            document.documentElement.className += ' is-returning';
        }
    </script>
</head>
<body>
    <!-- 顶部导航栏（.rectangle）：左侧头像 + 9 个学科导航项，点击后由 main.js 加载对应页面 -->
    <div class="rectangle">
        <!-- 头像：暂时作为「个人中心」的唯一入口（原来是右上角的文字链接）。
             button而不是div，是为了键盘也能进入（Tab 聚焦 + 回车触发）。
             点击后 main.js 的 playAvatarZoom() 会让 .avatar-zoom 从头像位置扩散覆盖全屏，再跳转 account/ -->
        <button class="rounded-square" type="button" id="navAvatar"
                title="个人中心" aria-label="进入个人中心">
            <!-- ⚠️ 临时：头像素材暂时置空（用 1×1 透明占位图），只换这里与 account/index.html
                 的 src，**不要动** #navAvatar 的结构与 main.js 的过场 —— 扩散遮罩读的是按钮的
                 getBoundingClientRect（main.js:298），与图片无关；恢复只需把 src 改回
                 image/avatar.png（原图 2.6MB 一直留在 image/ 里没删）。 -->
            <img src="image/avatar-blank.png" alt="头像" class="avatar">
            <!-- 登录态小圆点：已登录时由 main.js 给按钮挂 is-signed 类点亮 -->
            <span class="avatar-dot" id="navAvatarDot" aria-hidden="true"></span>
        </button>
        <!-- 学科导航项：data-page 指向该学科的页面路径（有独立模块的写 modules/<学科>/，
             其余仍是 pages/ 下的占位页），点击由 main.js 加载并缓存 -->
        <div class="nav-items">
            <div class="nav-rect" data-page="pages/chinese.html">语文</div>
            <div class="nav-rect" data-page="pages/math.html">数学</div>
            <div class="nav-rect" data-page="modules/english/english.html">英语</div>
            <div class="nav-rect" data-page="pages/physics.html">物理</div>
            <div class="nav-rect" data-page="pages/chemistry.html">化学</div>
            <div class="nav-rect" data-page="pages/biology.html">生物</div>
            <div class="nav-rect" data-page="pages/history.html">历史</div>
            <div class="nav-rect" data-page="pages/politics.html">政治</div>
            <div class="nav-rect" data-page="pages/geography.html">地理</div>
        </div>
    </div>
    <!-- 全屏扩散遮罩：进入个人中心的过场。圆心与半径由 main.js 按头像实际位置
         实时算好、逐帧写成行内 clip-path（样式表里的值只是兜底） -->
    <div class="avatar-zoom" id="avatarZoom" aria-hidden="true"></div>
    <!-- 内容容器：main.js 把导航项对应的学科页 HTML 注入这里（默认是英语页） -->
    <div class="content-container" id="contentContainer">
        <p class="placeholder-text">请选择一个科目查看内容</p>
    </div>
    <!-- 放 body 末尾：脚本执行时上面的 DOM 已经就位 -->
    <!-- 后台与个人中心的样式表（首页本身不用，读一遍只是为了「点头像」那一刻的形变）：
         main.js 要量出个人中心侧栏那颗头像的尺寸与位置，靠的是**真样式表** +
         临时插进来的两个探针元素。不预读的话那段会量到未经样式处理的值（回退是 40px 那颗），
         窄屏下会差 4px。动态插入（而不是直接写 <link>）有两个理由：
           · 不阻塞首页的首次渲染与 main.js 的执行（文件本身也只有 19KB）
           · 万一加载失败，onerror 一吞即可，绝不影响首页 —— 形变会按兜底值走
         两条路径都是相对于**文档**解析的，所以同一个相对地址在本页也有效。 -->
    <script>
        ['account/account.css'].forEach(function (href) {
            window.addEventListener('load', function () {
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = href;
                link.onerror = function () { /* 拿不到就按兜底值量，不打扰用户 */ };
                document.head.appendChild(link);
            });
        });
    </script>
    <script src="main.js"></script>
</body>
</html>
