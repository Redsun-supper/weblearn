[package]
name = "guangxue_wasm"
version = "0.1.0"
edition = "2021"
description = "广学 前端 WebAssembly 模块（Rust 部分）"
license = "MIT"

[lib]
# cdylib 生成可被浏览器加载的 .wasm；rlib 允许在宿主环境跑 cargo test / cargo unit
crate-type = ["cdylib", "rlib"]

[dependencies]
fsrs = "6.6.2"
# fsrs -> rand -> getrandom：wasm32 目标需要启用 js 后端才能编译
getrandom = { version = "0.4", features = ["wasm_js"] }
# 用于把 Rust 函数导出给浏览器中的 JavaScript 调用
wasm-bindgen = "0.2"
# 引擎 JSON 序列化（与前端/后端交换记忆状态）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 面向前端体积的场景：小体积、开启 LTO
opt-level = "s"
lto = true
codegen-units = 1
